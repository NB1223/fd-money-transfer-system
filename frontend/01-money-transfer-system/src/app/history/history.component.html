<div class="history-container">
  <h2>Transaction History</h2>

  <!-- Check if there are records to display -->
  <div *ngIf="transferHistory.length > 0; else noRecords">
    <table class="history-table">
      <thead>
        <tr>
          <th>Time</th>
          <th>From</th>
          <th>To</th>
          <th>Amount</th>
          <th>Type</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let transfer of transferHistory">
          <td>{{ transfer.timestamp | date: 'short' }}</td>
          <td>{{ transfer.fromAccountId }}</td>
          <td>{{ transfer.toAccountId }}</td>
          <td>{{ transfer.transferAmount | currency }}</td>
          <td>
            <span *ngIf="transfer.fromAccountId === 1" class="debit">Debit</span>
            <span *ngIf="transfer.toAccountId === 1" class="credit">Credit</span>
          </td>
        </tr>
      </tbody>
    </table>

    <!-- Pagination Controls -->
    <div class="pagination-controls">
      <button (click)="goToPage(currentPage - 1)" [disabled]="currentPage === 0">Previous</button>
      <span>Page {{ currentPage + 1 }} of {{ totalPages }}</span>
      <button (click)="goToPage(currentPage + 1)" [disabled]="currentPage + 1 >= totalPages">Next</button>
    </div>
  </div>

  <!-- No Records Template -->
  <ng-template #noRecords>
    <p>No transaction history available.</p>
  </ng-template>
</div>
