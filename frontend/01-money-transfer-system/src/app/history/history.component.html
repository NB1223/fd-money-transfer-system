<div class="history-container">
  <h2>Transfer History</h2>
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Amount</th>
        <th>Timestamp</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let transfer of transferHistory">
        <td>{{ transfer.id }}</td>
        <td>{{ transfer.amount }}</td>
        <td>{{ transfer.timestamp }}</td>
        <td>{{ transfer.status }}</td>
      </tr>
    </tbody>
  </table>

  <!-- Pagination Controls -->
  <div class="pagination-controls">
    <button (click)="goToPage(currentPage - 1)" [disabled]="currentPage === 0">Previous</button>
    <span>Page {{ currentPage + 1 }} of {{ totalPages }}</span>
    <button (click)="goToPage(currentPage + 1)" [disabled]="currentPage + 1 >= totalPages">Next</button>
  </div>
</div>
