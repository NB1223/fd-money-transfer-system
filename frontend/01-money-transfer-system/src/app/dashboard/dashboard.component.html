<link rel="stylesheet" 
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<div class="dashboard">
    <div class="dashboard-container">
        <!-- <h2>Good Morning, <strong>{{holderName}}</strong></h2> -->
        <div class="whitecard">
         <h3>Good Morning, <strong>{{userName | titlecase}}</strong></h3>
        <div class="balance-card" style="width: 18rem;">
            <div class="card-body">
                <h5 class="card-title">Account Balance</h5>
                <h1 class="card-subtitle mb-2 text-body-secondary">{{accountBalance |currency}}</h1>
                <p class="card-text">Account ID: {{accountId}}</p>
            </div>
        </div>
        
        
        </div>
    </div>
   
</div>
